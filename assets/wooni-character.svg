<?xml version="1.0" encoding="UTF-8"?>
<!--
  WOONI (우니) - AI Pet Character Asset
  ======================================
  Import this file into Figma (drag & drop or File > Import).
  Each body part is a named group — edit freely in Figma,
  then ask Claude Code to sync changes back to the app.

  Color Palette:
    Body:       #7EC8E3 (main), #A8DFF0 (highlight), #5BB0D0 (hands/feet)
    Eyes:       #2C3E50
    Blush:      #FFB6C1
    Whiskers:   #2C3E50 @ 40% opacity
-->
<svg width="400" height="500" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== TAIL (behind body) ===== -->
  <g id="tail">
    <path d="M115,80 Q135,60 125,40 Q120,30 130,20" stroke="#7EC8E3" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== LEFT LEG ===== -->
  <g id="leg-left">
    <path d="M35,100 L30,130" stroke="#7EC8E3" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="30" cy="133" rx="8" ry="5" fill="#5BB0D0"/><!-- foot -->
  </g>

  <!-- ===== RIGHT LEG ===== -->
  <g id="leg-right">
    <path d="M85,100 L90,130" stroke="#7EC8E3" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="90" cy="133" rx="8" ry="5" fill="#5BB0D0"/><!-- foot -->
  </g>

  <!-- ===== BODY ===== -->
  <g id="body">
    <ellipse cx="60" cy="78" rx="45" ry="35" fill="#7EC8E3"/>
    <ellipse cx="50" cy="68" rx="25" ry="15" fill="#A8DFF0" opacity="0.6"/><!-- highlight -->
  </g>

  <!-- ===== LEFT ARM ===== -->
  <g id="arm-left">
    <path d="M18,75 L5,95" stroke="#7EC8E3" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="4" cy="97" rx="5" ry="4" fill="#5BB0D0"/><!-- hand -->
  </g>

  <!-- ===== RIGHT ARM ===== -->
  <g id="arm-right">
    <path d="M102,75 L115,95" stroke="#7EC8E3" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="116" cy="97" rx="5" ry="4" fill="#5BB0D0"/><!-- hand -->
  </g>

  <!-- ===== LEFT EAR ===== -->
  <g id="ear-left">
    <path d="M25,52 Q15,18 42,42" stroke="#7EC8E3" stroke-width="8" fill="#7EC8E3" stroke-linecap="round"/>
    <path d="M27,49 Q20,24 40,43" stroke="#A8DFF0" stroke-width="3" fill="none" stroke-linecap="round"/><!-- inner ear -->
  </g>

  <!-- ===== RIGHT EAR ===== -->
  <g id="ear-right">
    <path d="M95,52 Q105,18 78,42" stroke="#7EC8E3" stroke-width="8" fill="#7EC8E3" stroke-linecap="round"/>
    <path d="M93,49 Q100,24 80,43" stroke="#A8DFF0" stroke-width="3" fill="none" stroke-linecap="round"/><!-- inner ear -->
  </g>

  <!-- ===== FACE ===== -->
  <g id="face">
    <!-- Eyes (open) -->
    <g id="eyes-open">
      <ellipse cx="42" cy="72" rx="6" ry="7" fill="#2C3E50"/><!-- left eye -->
      <ellipse cx="44" cy="69" rx="2.5" ry="2.5" fill="white"/><!-- left shine -->
      <ellipse cx="78" cy="72" rx="6" ry="7" fill="#2C3E50"/><!-- right eye -->
      <ellipse cx="80" cy="69" rx="2.5" ry="2.5" fill="white"/><!-- right shine -->
    </g>

    <!-- Eyes (closed) - hidden by default, show when sleeping -->
    <g id="eyes-closed" opacity="0">
      <path d="M36,72 Q42,77 48,72" stroke="#2C3E50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M72,72 Q78,77 84,72" stroke="#2C3E50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Nose -->
    <ellipse id="nose" cx="60" cy="80" rx="3" ry="2" fill="#5BB0D0"/>

    <!-- Mouth -->
    <path id="mouth" d="M52,85 Q60,91 68,85" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Whiskers -->
    <g id="whiskers" opacity="0.4">
      <line x1="15" y1="75" x2="35" y2="78" stroke="#2C3E50" stroke-width="1.2"/>
      <line x1="15" y1="82" x2="35" y2="82" stroke="#2C3E50" stroke-width="1.2"/>
      <line x1="85" y1="78" x2="105" y2="75" stroke="#2C3E50" stroke-width="1.2"/>
      <line x1="85" y1="82" x2="105" y2="82" stroke="#2C3E50" stroke-width="1.2"/>
    </g>

    <!-- Blush -->
    <ellipse id="blush-left" cx="30" cy="82" rx="7" ry="4" fill="#FFB6C1" opacity="0.5"/>
    <ellipse id="blush-right" cx="90" cy="82" rx="7" ry="4" fill="#FFB6C1" opacity="0.5"/>
  </g>

</svg>
