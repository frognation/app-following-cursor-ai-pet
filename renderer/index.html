<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wooni Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pet Container -->
  <div id="pet-container">
    <div id="pet" class="state-idle">
      <!-- SVG Pet Character "Wooni" -->
      <svg id="pet-svg" viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg">
        <!-- Tail (behind body) -->
        <path class="tail" d="M115,80 Q135,60 125,40 Q120,30 130,20" stroke="#7EC8E3" stroke-width="5" fill="none" stroke-linecap="round"/>

        <!-- Left Leg -->
        <g class="leg leg-left">
          <path d="M35,100 L30,130" stroke="#7EC8E3" stroke-width="7" fill="none" stroke-linecap="round"/>
          <ellipse cx="30" cy="133" rx="8" ry="5" fill="#5BB0D0"/><!-- foot -->
        </g>

        <!-- Right Leg -->
        <g class="leg leg-right">
          <path d="M85,100 L90,130" stroke="#7EC8E3" stroke-width="7" fill="none" stroke-linecap="round"/>
          <ellipse cx="90" cy="133" rx="8" ry="5" fill="#5BB0D0"/><!-- foot -->
        </g>

        <!-- Body (round cat shape) -->
        <ellipse class="body" cx="60" cy="78" rx="45" ry="35" fill="#7EC8E3"/>
        <ellipse class="body-highlight" cx="50" cy="68" rx="25" ry="15" fill="#A8DFF0" opacity="0.6"/>

        <!-- Left Arm -->
        <g class="arm arm-left">
          <path d="M18,75 L5,95" stroke="#7EC8E3" stroke-width="6" fill="none" stroke-linecap="round"/>
          <ellipse cx="4" cy="97" rx="5" ry="4" fill="#5BB0D0"/><!-- hand -->
        </g>

        <!-- Right Arm -->
        <g class="arm arm-right">
          <path d="M102,75 L115,95" stroke="#7EC8E3" stroke-width="6" fill="none" stroke-linecap="round"/>
          <ellipse cx="116" cy="97" rx="5" ry="4" fill="#5BB0D0"/><!-- hand -->
        </g>

        <!-- Left Ear -->
        <path class="ear ear-left" d="M25,52 Q15,18 42,42" stroke="#7EC8E3" stroke-width="8" fill="#7EC8E3" stroke-linecap="round"/>
        <path d="M27,49 Q20,24 40,43" stroke="#A8DFF0" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- Right Ear -->
        <path class="ear ear-right" d="M95,52 Q105,18 78,42" stroke="#7EC8E3" stroke-width="8" fill="#7EC8E3" stroke-linecap="round"/>
        <path d="M93,49 Q100,24 80,43" stroke="#A8DFF0" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- Eyes -->
        <g class="eyes">
          <ellipse class="eye eye-left" cx="42" cy="72" rx="6" ry="7" fill="#2C3E50"/>
          <ellipse class="eye-shine" cx="44" cy="69" rx="2.5" ry="2.5" fill="white"/>
          <ellipse class="eye eye-right" cx="78" cy="72" rx="6" ry="7" fill="#2C3E50"/>
          <ellipse class="eye-shine" cx="80" cy="69" rx="2.5" ry="2.5" fill="white"/>
        </g>

        <!-- Closed Eyes (hidden by default, for sleeping) -->
        <g class="eyes-closed" style="display:none">
          <path d="M36,72 Q42,77 48,72" stroke="#2C3E50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M72,72 Q78,77 84,72" stroke="#2C3E50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>

        <!-- Dizzy X Eyes (hidden by default, for flung/grabbed) -->
        <g class="eyes-dizzy" style="display:none">
          <line x1="36" y1="66" x2="48" y2="78" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
          <line x1="48" y1="66" x2="36" y2="78" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
          <line x1="72" y1="66" x2="84" y2="78" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
          <line x1="84" y1="66" x2="72" y2="78" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Nose -->
        <ellipse cx="60" cy="80" rx="3" ry="2" fill="#5BB0D0"/>

        <!-- Mouth -->
        <path class="mouth" d="M52,85 Q60,91 68,85" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- Whiskers -->
        <g class="whiskers" opacity="0.4">
          <line x1="15" y1="75" x2="35" y2="78" stroke="#2C3E50" stroke-width="1.2"/>
          <line x1="15" y1="82" x2="35" y2="82" stroke="#2C3E50" stroke-width="1.2"/>
          <line x1="85" y1="78" x2="105" y2="75" stroke="#2C3E50" stroke-width="1.2"/>
          <line x1="85" y1="82" x2="105" y2="82" stroke="#2C3E50" stroke-width="1.2"/>
        </g>

        <!-- Blush -->
        <ellipse class="blush blush-left" cx="30" cy="82" rx="7" ry="4" fill="#FFB6C1" opacity="0.5"/>
        <ellipse class="blush blush-right" cx="90" cy="82" rx="7" ry="4" fill="#FFB6C1" opacity="0.5"/>
      </svg>

      <!-- Voice indicator -->
      <div id="voice-indicator" class="hidden">
        <div class="voice-ring"></div>
        <div class="voice-ring"></div>
        <div class="voice-ring"></div>
      </div>
    </div>

    <!-- Speech Bubble -->
    <div id="speech-bubble" class="hidden">
      <div id="speech-text"></div>
      <div class="speech-arrow"></div>
    </div>
  </div>

  <!-- Chat Input (shown on double-click) -->
  <div id="chat-container" class="hidden">
    <div id="chat-box">
      <input type="text" id="chat-input" placeholder="우니에게 물어보세요..." autocomplete="off"/>
      <button id="chat-send">↵</button>
    </div>
  </div>

  <!-- Settings button (small gear icon near pet) -->
  <div id="settings-btn" class="hidden" title="Settings">⚙️</div>

  <script src="pet.js"></script>
  <script src="voice.js"></script>
  <script src="chat.js"></script>
</body>
</html>
