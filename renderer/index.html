<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wooni Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pet Container -->
  <div id="pet-container">
    <div id="pet" class="state-idle">
      <!-- Frame-animated SVG Wooni, based on the generated character sheet -->
      <svg id="pet-svg" viewBox="0 0 190 130" xmlns="http://www.w3.org/2000/svg" aria-label="Wooni, a black cat">
        <defs>
          <filter id="ink-wobble" x="-8%" y="-8%" width="116%" height="116%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="8" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>

        <g class="pet-art" filter="url(#ink-wobble)">
          <!-- Neutral standing -->
          <g class="cat-pose pose-stand">
            <path class="cat-tail" d="M54 72 C34 57 35 31 39 10"/>
            <path class="cat-body" d="M48 70 C50 38 72 28 101 34 C124 38 132 55 130 77 L119 88 L64 89 Z"/>
            <path class="cat-leg far" d="M71 76 C69 88 69 105 70 119"/>
            <path class="cat-leg far" d="M113 75 C111 91 112 106 114 120"/>
            <path class="cat-leg" d="M58 74 C56 91 57 107 58 121"/>
            <path class="cat-leg" d="M126 72 C126 88 128 106 128 120"/>
            <g class="face-group">
              <path class="cat-head" d="M117 59 L119 30 L135 43 L149 30 L151 58 C160 70 151 84 136 85 C118 86 109 72 117 59 Z"/>
              <g class="eyes">
                <ellipse cx="131" cy="59" rx="7" ry="10"/><ellipse cx="148" cy="58" rx="7" ry="10"/>
              </g>
              <g class="eyes-dizzy">
                <path d="M126 53 L136 65 M136 53 L126 65 M143 52 L153 64 M153 52 L143 64"/>
              </g>
              <path class="cat-nose" d="M158 68 l5 2 -5 3 z"/>
              <path class="mouth" d="M158 73 Q154 77 151 74"/>
              <g class="whiskers"><path d="M157 66 L176 62 M158 70 L178 70 M157 74 L175 79"/></g>
            </g>
          </g>

          <!-- Slow walk: contact frame -->
          <g class="cat-pose pose-walk-a">
            <path class="cat-tail" d="M49 67 C26 52 27 25 34 8"/>
            <path class="cat-body" d="M43 66 C56 39 84 37 118 50 C128 54 133 66 127 78 C104 83 72 82 49 75 Z"/>
            <path class="cat-leg far" d="M68 71 Q61 88 49 110"/>
            <path class="cat-leg far" d="M108 72 Q117 88 128 107"/>
            <path class="cat-leg" d="M55 70 Q48 87 38 112"/>
            <path class="cat-leg" d="M118 70 Q132 89 151 108"/>
            <g class="face-group">
              <path class="cat-head" d="M116 55 L120 30 L134 43 L148 34 L151 57 C161 68 154 82 139 84 C122 85 111 70 116 55 Z"/>
              <g class="eyes"><ellipse cx="132" cy="60" rx="7" ry="10"/><ellipse cx="149" cy="60" rx="7" ry="10"/></g>
              <path class="cat-nose" d="M159 69 l5 2 -5 3 z"/><path class="mouth" d="M159 73 Q155 77 152 74"/>
              <g class="whiskers"><path d="M157 66 L177 62 M159 70 L179 70 M157 74 L176 80"/></g>
            </g>
          </g>

          <!-- Slow walk: passing frame -->
          <g class="cat-pose pose-walk-b">
            <path class="cat-tail" d="M48 68 C27 49 28 23 36 7"/>
            <path class="cat-body" d="M43 65 C56 41 83 39 116 48 C129 52 134 65 128 78 C101 83 69 81 48 75 Z"/>
            <path class="cat-leg far" d="M67 71 Q71 91 84 108"/>
            <path class="cat-leg far" d="M109 71 Q101 91 92 111"/>
            <path class="cat-leg" d="M55 70 Q63 91 75 111"/>
            <path class="cat-leg" d="M119 70 Q112 90 101 111"/>
            <g class="face-group">
              <path class="cat-head" d="M116 54 L121 29 L135 43 L149 34 L151 57 C161 68 154 82 139 84 C122 85 111 69 116 54 Z"/>
              <g class="eyes"><ellipse cx="132" cy="59" rx="7" ry="10"/><ellipse cx="149" cy="59" rx="7" ry="10"/></g>
              <path class="cat-nose" d="M159 68 l5 2 -5 3 z"/><path class="mouth" d="M159 72 Q155 76 152 73"/>
              <g class="whiskers"><path d="M157 65 L177 61 M159 69 L179 69 M157 73 L176 79"/></g>
            </g>
          </g>

          <!-- Fast run: stretched frame -->
          <g class="cat-pose pose-run-stretch">
            <path class="cat-tail" d="M55 65 C34 55 22 48 9 43"/>
            <path class="cat-body" d="M42 63 C65 45 103 45 133 61 C139 65 138 76 128 79 C96 83 64 79 40 72 Z"/>
            <path class="cat-leg far" d="M59 69 Q40 79 20 91"/>
            <path class="cat-leg far" d="M116 70 Q140 79 169 83"/>
            <path class="cat-leg" d="M52 67 Q29 72 10 82"/>
            <path class="cat-leg" d="M124 68 Q146 72 179 75"/>
            <g class="face-group">
              <path class="cat-head" d="M125 55 L130 31 L143 44 L157 35 L159 59 C168 70 160 82 146 84 C130 85 120 69 125 55 Z"/>
              <g class="eyes"><ellipse cx="141" cy="60" rx="7" ry="10"/><ellipse cx="157" cy="60" rx="7" ry="10"/></g>
              <path class="cat-nose" d="M167 69 l5 2 -5 3 z"/><path class="mouth" d="M167 73 Q163 77 160 74"/>
              <g class="whiskers"><path d="M165 66 L184 62 M167 70 L187 70 M165 74 L183 79"/></g>
            </g>
          </g>

          <!-- Fast run: gathered frame -->
          <g class="cat-pose pose-run-gather">
            <path class="cat-tail" d="M61 68 C41 55 29 47 15 49"/>
            <path class="cat-body" d="M45 72 C48 36 78 25 110 38 C130 46 135 66 122 80 C96 91 65 91 45 72 Z"/>
            <path class="cat-leg far" d="M64 72 Q70 90 88 102"/>
            <path class="cat-leg far" d="M109 72 Q99 91 82 104"/>
            <path class="cat-leg" d="M57 70 Q63 94 79 108"/>
            <path class="cat-leg" d="M117 69 Q110 94 92 108"/>
            <g class="face-group">
              <path class="cat-head" d="M111 51 L116 27 L130 40 L143 31 L146 54 C155 65 149 79 134 81 C117 82 106 66 111 51 Z"/>
              <g class="eyes"><ellipse cx="127" cy="56" rx="7" ry="10"/><ellipse cx="144" cy="56" rx="7" ry="10"/></g>
              <path class="cat-nose" d="M154 65 l5 2 -5 3 z"/><path class="mouth" d="M154 69 Q150 73 147 70"/>
              <g class="whiskers"><path d="M152 62 L172 58 M154 66 L174 66 M152 70 L171 76"/></g>
            </g>
          </g>

          <!-- Relaxed loaf -->
          <g class="cat-pose pose-loaf">
            <path class="cat-tail" d="M50 93 C27 96 20 108 30 115 C54 120 83 115 99 108"/>
            <path class="cat-body" d="M46 91 C48 56 77 43 111 54 C132 61 139 83 126 103 C99 115 66 113 44 102 Z"/>
            <ellipse class="cat-paw-shape" cx="117" cy="108" rx="22" ry="7"/>
            <ellipse class="cat-paw-shape" cx="83" cy="109" rx="19" ry="6"/>
            <g class="face-group">
              <path class="cat-head" d="M103 65 L108 37 L123 51 L139 40 L141 67 C152 79 144 94 127 96 C108 97 97 80 103 65 Z"/>
              <g class="eyes"><ellipse cx="120" cy="72" rx="7" ry="10"/><ellipse cx="138" cy="71" rx="7" ry="10"/></g>
              <path class="cat-nose" d="M149 81 l5 2 -5 3 z"/><path class="mouth" d="M149 85 Q145 89 142 86"/>
              <g class="whiskers"><path d="M147 78 L168 74 M149 82 L170 82 M147 86 L167 92"/></g>
            </g>
          </g>

          <!-- Lying awake -->
          <g class="cat-pose pose-lie">
            <path class="cat-tail" d="M59 102 C36 104 22 111 16 120"/>
            <path class="cat-body" d="M45 93 C66 70 104 69 139 89 C151 96 148 108 133 112 C95 116 67 113 42 105 Z"/>
            <path class="cat-paw" d="M121 104 Q146 107 175 114"/>
            <path class="cat-paw" d="M115 109 Q139 116 161 122"/>
            <g class="face-group">
              <path class="cat-head" d="M40 83 L45 57 L59 70 L74 60 L76 84 C86 95 79 108 64 110 C47 111 35 97 40 83 Z"/>
              <g class="eyes"><ellipse cx="56" cy="88" rx="7" ry="10"/><ellipse cx="73" cy="87" rx="7" ry="10"/></g>
              <path class="cat-nose" d="M84 97 l5 2 -5 3 z"/><path class="mouth" d="M84 101 Q80 105 77 102"/>
              <g class="whiskers"><path d="M82 94 L102 90 M84 98 L105 98 M82 102 L101 108"/></g>
            </g>
          </g>

          <!-- Curled sleeping -->
          <g class="cat-pose pose-sleep">
            <path class="cat-body" d="M37 96 C35 55 73 29 118 43 C151 53 158 89 137 109 C107 126 61 120 37 96 Z"/>
            <path class="cat-tail" d="M136 99 C122 119 77 124 43 108"/>
            <g class="face-group">
              <path class="cat-head" d="M43 78 L48 51 L62 64 L77 54 L79 80 C89 91 82 104 67 106 C50 107 38 93 43 78 Z"/>
              <g class="eyes-closed"><path d="M53 84 Q59 91 65 84 M69 83 Q75 90 81 83"/></g>
              <path class="cat-nose" d="M87 94 l5 2 -5 3 z"/>
              <g class="whiskers"><path d="M85 91 L104 87 M87 95 L107 95 M85 99 L104 105"/></g>
            </g>
            <g class="sleep-zs" aria-hidden="true">
              <g class="sleep-z sleep-z-1"><text class="sleep-z-letter" x="91" y="80">z</text></g>
              <g class="sleep-z sleep-z-2"><text class="sleep-z-letter" x="108" y="61">z</text></g>
              <g class="sleep-z sleep-z-3"><text class="sleep-z-letter" x="126" y="40">z</text></g>
            </g>
          </g>
        </g>
      </svg>

      <!-- Voice indicator -->
      <div id="voice-indicator" class="hidden">
        <div class="voice-ring"></div>
        <div class="voice-ring"></div>
        <div class="voice-ring"></div>
      </div>
    </div>

    <!-- Speech Bubble -->
    <div id="speech-bubble" class="hidden">
      <div id="speech-content">
        <div id="speech-text"></div>
      </div>
      <div id="speech-actions" class="hidden">
        <button id="btn-copy" title="Copy">📋</button>
        <button id="btn-send-claude" title="Send to Claude Code">🚀</button>
      </div>
      <div class="speech-arrow"></div>
    </div>
  </div>

  <!-- Cat House (숨숨집) - bottom right -->
  <div id="cat-house" class="hidden">
    <img id="cat-house-image" src="../assets/House.png" alt="Cat house" draggable="false">
    <!-- Speech bubble from house (for notifications while cat is inside) -->
    <div id="house-speech" class="hidden">
      <div id="house-speech-text"></div>
      <div class="speech-arrow"></div>
    </div>

    <!-- Optional paid AI CLI usage, anchored beside the house -->
    <div id="ai-usage-panel" class="hidden" role="status" aria-live="polite">
      <div id="ai-usage-providers"></div>
      <button id="ai-usage-refresh" type="button" title="Refresh AI usage" aria-label="Refresh AI usage">↻</button>
    </div>
  </div>

  <!-- Floating Notification (follows cursor) -->
  <div id="floating-notification" class="hidden">
    <div id="notif-text"></div>
    <div id="notif-actions">
      <button id="notif-show" class="notif-btn notif-show">Show me</button>
      <button id="notif-later" class="notif-btn notif-later">Later</button>
      <button id="notif-dismiss" class="notif-btn notif-dismiss">Go away</button>
    </div>
  </div>

  <!-- Chat Input (shown on double-click) -->
  <div id="chat-container" class="hidden">
    <div id="chat-box">
      <input type="text" id="chat-input" placeholder="Ask Wooni something..." autocomplete="off"/>
      <button id="chat-send">↵</button>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="pet.js"></script>
  <script src="usage.js"></script>
  <script src="voice.js"></script>
  <script src="chat.js"></script>
  <script src="monitor.js"></script>
</body>
</html>
